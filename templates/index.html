<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>bbitter</title>
  <link rel="stylesheet" href="{{root}}style.css">
</head>
<body>
  <header>
    <h1>bbitter <span>/ curated feed</span></h1>
    <div class="meta">{{tweet-count}} tweets from {{account-count}} accounts &middot; {{generated-at}}</div>
    <nav class="accounts">
      {% for a in accounts %}<a href="{{root}}@{{a.screen-name}}/">@{{a.screen-name}}</a>{% endfor %}
    </nav>
  </header>

  <main>
    {% for tweet in tweets %}
    {% include "tweet.html" %}
    {% endfor %}
  </main>

  <footer>
    Generated by bbitter
  </footer>

  {% include "modal.html" %}
</body>
</html>
